<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Dashboard</title>
    <!-- CDN Bootstrap dan Bootstrap Icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        integrity="sha384-Bk5cbLkZQ5raZ0+H2/+VbfYx3WpvxvQK4zqXZr7sYODuaX7bKXoSOnipQxkaS8sv" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar bg-primary bg-gradient px-3 py-2 text-white shadow-sm">
        <div class="container-fluid d-flex align-items-center gap-2 text-start">
            <i class="bi bi-mortarboard fs-4"></i>
            <span class="navbar-brand mb-0 me-auto h1 text-white">Student Dashboard</span>
        </div>
    </nav>
    <div class="container my-4">
        <div class="card p-1 border-0 shadow-sm d-flex justify-content-between">
            <div class="d-flex justify-content-between align-items-center">
                <h4 class="fw-bold text-primary text-nowrap px-3">Daftar Nilai Siswa</h4>
                <div class="search-box">
                    <div class="input-group bg-white">
                        <i class="bi bi-search me-1 input-group-text"></i>
                        <input type="text" id="searchInput" placeholder="Cari nama Siswa..." class=" form-control">
                    </div>
                </div>
            </div>
            <div class="table-wrapper m-3">
                <table class="table table-striped text-center mt-0">
                    <thead>
                        <tr class="text-center table-light">
                            <th>No</th>
                            <th class="text-start"> Nama Siswa</th>
                            <th>Kelas</th>
                            <th>Nilai Score</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable"></tbody>
                </table>
                <div class="text-end mt-3">
                    Rata-rata Nilai: <span id="averageScore" class="bg-primary text-white px-2 py-1 rounded-1">0</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
